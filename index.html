<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cerca pel·lícules i descobreix els seus títols a TMDB.">
    <link rel="icon" href="nc.png" type="image/png">
    <title>TMDB - Cercador de pel·lícules</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estils.css">
</head>
<body>

    <header>
        <a href="https://www.themoviedb.org/?language=ca">
            <img src="3.svg" alt="Logo TMDB" height="25">
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Buscador</a></li>
                <li><a href="contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="buscador">
            <h1>Busca una pel·lícula</h1>
            <p>Milions de títols, un sol cercador.</p>

            <form method="get" action="https://www.themoviedb.org/search">
                <input
                    type="search"
                    id="pelicula"
                    name="query"
                    placeholder="Cerca una pel·lícula, per exemple «Dune»..."
                    aria-label="Nom de la pel·lícula"
                    required
                >
                <button type="submit">Cercar</button>
            </form>
        </section>

        <section class="pelicules">
            <h2>Resultats</h2>

            <div class="resultats">

                <article class="targeta">
                    <img src="4.jpg.jpg.jpg" alt="Dune: Part Two">
                    <h3>Dune: Part Two</h3>
                    <p>2024</p>
                </article>

                <article class="targeta">
                    <img src="5.jpg" alt="The Lord of the Rings: The Two Towers">
                    <h3>The Lord of the Rings: The Two Towers</h3>
                    <p>2002</p>
                </article>

                <article class="targeta">
                    <img src="spiderman.jpg.jpg" alt="Spider-Man: Brand New Day">
                    <h3>Spider-Man: Brand New Day</h3>
                    <p>2026</p>
                </article>

            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 The Movie Database — Maqueta de disseny</p>
    </footer>

</body>
</html>
